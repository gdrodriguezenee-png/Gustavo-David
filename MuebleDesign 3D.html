<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MuebleDesign 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --steel:#23272B; --steel-2:#2F3439; --steel-3:#3C4248; --steel-ink:#E9EBE7; --steel-muted:#9AA1A8;
  --paper:#EEF0ED; --panel:#FFFFFF; --panel-2:#F6F7F5; --ink:#1B1E21; --muted:#646B72; --line:#D6D9D4;
  --tape:#F2B300; --tape-ink:#2B2100; --tape-soft:#FFF3C7;
  --wood:#B98A55; --ok:#2E7A4C; --warn:#A8601C; --danger:#B03636; --blue:#1F5C99;
  --r-s:4px; --r-m:7px;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-c:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15171A; --panel:#1E2124; --panel-2:#24282C; --ink:#E6E8E4; --muted:#9BA2A9; --line:#343A40;
    --tape-soft:#3A3010; --steel:#101214; --steel-2:#1B1E21; --steel-3:#2A2E33; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15171A; --panel:#1E2124; --panel-2:#24282C; --ink:#E6E8E4; --muted:#9BA2A9; --line:#343A40;
  --tape-soft:#3A3010; --steel:#101214; --steel-2:#1B1E21; --steel-3:#2A2E33; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.num,td.n,.tab-nums{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-c);font-weight:600;letter-spacing:.01em;margin:0;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px}
p{margin:0 0 .6em}
a{color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}

/* layout */
#app{display:grid;grid-template-columns:236px 1fr;height:100%}
#side{background:var(--steel);color:var(--steel-ink);display:flex;flex-direction:column;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid var(--steel-3)}
.brand-mark{width:30px;height:30px;flex:none}
.brand b{font-family:var(--font-c);font-size:21px;font-weight:700;letter-spacing:.01em;display:block;line-height:1}
.brand span{font-size:12px;color:var(--steel-muted)}
#nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px}
#nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-s);color:var(--steel-muted);font-weight:500;font-size:14.5px}
#nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
#nav button:hover{background:var(--steel-2);color:var(--steel-ink)}
#nav button[aria-current="page"]{background:var(--steel-2);color:#fff;box-shadow:inset 3px 0 0 var(--tape)}
#nav button:focus-visible{outline:2px solid var(--tape);outline-offset:-2px}
.side-foot{margin-top:auto;padding:14px;border-top:1px solid var(--steel-3);display:flex;flex-direction:column;gap:8px}
.side-foot .btn{justify-content:center}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);min-height:58px;flex-wrap:wrap}
#top .pname{font-family:var(--font-c);font-size:21px;font-weight:600;border:1px solid transparent;background:transparent;padding:3px 6px;border-radius:var(--r-s);min-width:120px;max-width:420px;width:100%}
#top .pname:hover{border-color:var(--line)}
#top .pname:focus{border-color:var(--tape);outline:none;background:var(--panel-2)}
.top-left{display:flex;align-items:center;gap:8px;flex:1 1 280px;min-width:0}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#hamb{display:none}
#view{flex:1;overflow:auto;min-height:0}
.page{padding:22px 24px 40px;max-width:1280px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:68ch}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;line-height:1.25;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.btn.primary{background:var(--tape);border-color:var(--tape);color:var(--tape-ink);font-weight:600}
.btn.primary:hover{filter:brightness(.95)}
.btn.dark{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn[aria-pressed="true"]{background:var(--steel);color:#fff;border-color:var(--steel)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#side .btn{background:var(--steel-2);border-color:var(--steel-3);color:var(--steel-ink)}
#side .btn.primary{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.f.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-s);padding:6px 8px;font-size:14px;color:var(--ink);width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tape);box-shadow:0 0 0 2px color-mix(in srgb,var(--tape) 30%,transparent)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--steel)}
input[type=range]{width:100%;accent-color:var(--tape)}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:var(--r-s);background:none}
.unit{position:relative}
.unit input{padding-right:34px}
.unit::after{content:attr(data-u);position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.sep{height:1px;background:var(--line);margin:14px 0}

/* section blocks: dimension-line motif */
.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;margin-bottom:16px}
.block>h3{margin-bottom:10px}
.cota{display:block;position:relative;height:9px;margin-top:5px;border-left:1.5px solid var(--muted);border-right:1.5px solid var(--muted)}
.cota::before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:var(--muted)}
.measure{display:flex;flex-direction:column;min-width:0}
.measure .v{font-family:var(--font-c);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.measure .v small{font-size:15px;font-weight:500;color:var(--muted);margin-left:3px}
.measure .k{font-size:13px;color:var(--muted);margin-top:6px}
.measures{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px 26px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel)}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:600;background:var(--panel-2)}
.tbl input,.tbl select{padding:4px 6px;font-size:13.5px}
.code{font-family:var(--font-c);font-weight:600;font-size:15px;background:var(--tape-soft);padding:1px 6px;border-radius:3px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
.chip.est{background:var(--tape-soft);border-color:var(--tape);color:var(--ink);font-weight:600}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--tape)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r-m);background:var(--tape-soft);border:1px solid var(--tape);font-size:14px;margin-bottom:14px}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px;stroke:var(--ink);fill:none;stroke-width:1.8}
.notice.info{background:var(--panel-2);border-color:var(--line)}
.warnlist{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--warn)}

/* designer */
.designer{display:grid;grid-template-columns:1fr 360px;grid-template-rows:1fr auto;height:100%;min-height:0}
.stagewrap{position:relative;min-width:0;min-height:320px;background:linear-gradient(180deg,var(--panel-2),var(--paper))}
.stage-host{position:absolute;inset:0}
.stage-host canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.toolbar{position:absolute;top:10px;left:10px;right:10px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.toolbar>*{pointer-events:auto}
.toolbar.drawing>*:not([data-act="draw-toggle"]){display:none}
.draw-wrap{padding-top:50px!important}
.tgroup{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.tgroup .btn{border:none;border-radius:0;border-right:1px solid var(--line)}
.tgroup .btn:last-child{border-right:none}
.hidemenu{position:relative}
.hidemenu .menu{position:absolute;top:100%;left:0;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:200px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.pickcard{position:absolute;left:10px;bottom:10px;z-index:2;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tape);border-radius:var(--r-m);padding:10px 12px;font-size:13.5px;max-width:300px}
.estflag{position:absolute;right:10px;bottom:10px;z-index:2;max-width:340px}
.dpanel{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{all:unset;cursor:pointer;padding:8px 10px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tape)}
.tabs button:focus-visible{outline:2px solid var(--tape)}
.dpanel-body{overflow:auto;padding:14px;flex:1;min-height:0}
.modcard{border:1px solid var(--line);border-radius:var(--r-m);padding:12px;margin-bottom:12px;background:var(--panel-2)}
.modcard h4{margin:0;font-family:var(--font-c);font-size:17px;font-weight:600}
.mini-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:5px;align-items:center;margin-bottom:5px}
.mini-row.c3{grid-template-columns:1fr 1fr auto}
.mini-row.c2{grid-template-columns:1fr auto}
.mini-row.c2w{grid-template-columns:1fr auto auto}
.draw-wrap{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;padding-top:52px;background:var(--panel-2)}
.drawbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.drawbar select,.drawbar input{width:auto;padding:4px 6px;font-size:13px}
.drawbar .lbl{font-size:12.5px;color:var(--muted)}
.draw-host{flex:1;min-height:0;position:relative}
.draw-host svg{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;user-select:none;background:#fff}
.drawhint{background:var(--tape-soft);border-bottom:1px solid var(--line);padding:6px 12px;font-size:13px}
.dl-item{border:1px solid var(--line);border-radius:var(--r-m);padding:8px 10px;margin-bottom:8px;background:var(--panel-2)}
.dl-item.sel{border-color:var(--tape);box-shadow:0 0 0 2px var(--tape)}
.dl-coords{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.dl-coords input{padding:3px 5px;font-size:12.5px}
.mini-row select,.mini-row input{padding:4px 5px;font-size:13px}
.iconx{all:unset;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:var(--r-s);color:var(--muted)}
.iconx:hover{background:var(--line);color:var(--danger)}
.sub{font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 5px}
.livebar{grid-column:1/-1;display:flex;gap:4px 26px;flex-wrap:wrap;align-items:center;padding:9px 18px;background:var(--steel);color:var(--steel-ink);font-size:13px}
.livebar .lv{display:flex;flex-direction:column}
.livebar .lv b{font-family:var(--font-c);font-size:19px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1}
.livebar .lv span{color:var(--steel-muted);font-size:12px}
.livebar .lv.accent b{color:var(--tape)}
.partlist .pitem{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.partlist .pitem:hover{background:var(--panel-2)}
.partlist .pitem .code{grid-row:span 3;align-self:start}

/* dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:stretch;margin-bottom:18px}
.hero-fig{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:flex;align-items:center;justify-content:center;min-height:300px}
.hero-fig svg{width:100%;height:auto;max-height:420px}
.hero-info{display:flex;flex-direction:column;gap:16px;justify-content:center}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ptile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;display:flex;flex-direction:column}
.ptile .fig{background:var(--panel-2);height:150px;display:flex;align-items:center;justify-content:center;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.ptile .fig svg{max-height:130px;width:auto;max-width:100%}
.ptile .body{padding:10px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.ptile .body b{font-family:var(--font-c);font-size:18px;font-weight:600}
.ptile .acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tpl{cursor:pointer;text-align:left}
.tpl[aria-pressed="true"]{border-color:var(--tape);box-shadow:0 0 0 2px var(--tape)}

/* plans */
.planbox{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:12px;overflow:auto}
.planbox svg{width:100%;height:auto;max-height:70vh;display:block}
.isoimg{max-width:100%;display:block;margin:auto}

/* optimizer visuals */
.bars svg{width:100%;height:auto;display:block}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sheets svg{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r-s)}

/* photo */
.photo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.dropzone{border:2px dashed var(--line);border-radius:var(--r-m);padding:26px;text-align:center;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.dropzone:hover,.dropzone.over{border-color:var(--tape)}
.dropzone img{max-width:100%;max-height:360px;border-radius:var(--r-s)}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.step .sn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--font-c);font-weight:600;font-size:15px}
.step.done .sn{background:var(--steel);color:#fff;border-color:var(--steel)}
.step.cur .sn{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}

/* modal / toast */
#modal{position:fixed;inset:0;background:rgba(15,17,19,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.open{display:flex}
#modal .dialog{background:var(--panel);border-radius:var(--r-m);max-width:520px;width:100%;padding:20px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--steel);color:#fff;padding:9px 16px;border-radius:var(--r-s);font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}

/* client mode */
#client{position:fixed;inset:0;z-index:40;background:var(--paper);display:none;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#client.open{display:grid}
.cl-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.cl-head img{height:34px;width:auto}
.cl-stage{position:relative;min-height:300px;background:linear-gradient(180deg,var(--panel-2),var(--paper))}
.cl-panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.price-big{font-family:var(--font-c);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}

@media (max-width:1100px){
  .designer{grid-template-columns:1fr 320px}
  .hero{grid-template-columns:1fr}
}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  #side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  #hamb{display:inline-flex}
  .page{padding:16px 14px 32px}
  #top{padding:8px 12px}
  .designer{grid-template-columns:1fr;grid-template-rows:56vh auto auto;height:auto}
  .dpanel{border-left:none;border-top:1px solid var(--line)}
  .dpanel-body{overflow:visible}
  .livebar{grid-row:2}
  .photo-grid{grid-template-columns:1fr}
  #client{grid-template-columns:1fr;grid-template-rows:auto 50vh auto;overflow:auto}
  .cl-panel{border-left:none;overflow:visible}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){
  .grid2,.grid3{grid-template-columns:1fr}
  .measure .v{font-size:25px}
  h1{font-size:25px}
  .top-right .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{#side,#top{display:none}}
</style>

function shoppingList(units) {
  const P = purchase(units), n = P.n, st = S.settings, R = [];
  const row = (sec, item, qty, unit, up, need, note) => R.push({ sec, item, qty, unit, up, total: qty * up, need: need || '', note: note || '' });
  P.steel.forEach(s => row('Tubos y perfiles', s.mat.name, s.bars, barName(s.mat), s.mat.price, `${fmt(s.used / 1000, 2)} m en ${s.pieces} piezas`, s.mat.code ? `Código ${s.mat.code}` : ''));
  P.boards.forEach(b => row('Láminas, tableros, mallas y lonas', b.mat.name, b.sheets, 'hoja', b.mat.price, `${fmt(b.area, 2)} m²`, b.mat.code ? `Código ${b.mat.code}` : ''));
  P.covers.forEach(c => { if (c.sheetsTxt) row('Láminas, tableros, mallas y lonas', c.mat.name, c.sheets, 'lámina', c.cost / Math.max(1, c.sheets), `${fmt(c.area, 2)} m²`, c.sheetsTxt); else { const q = Math.ceil(c.area * 2) / 2; row('Láminas, tableros, mallas y lonas', c.mat.name, q, 'm²', unitPrice(c.mat), `${fmt(c.area, 2)} m² con traslapes`, ''); } });
  // herrajes y consumibles por pieza

    if (m.unit === 'caja' && m.pres > 1) row(m.kind === 'herraje' ? 'Herrajes' : 'Tornillería y consumibles', m.name, Math.ceil(need / m.pres), 'caja', m.price, `${fmt(need)} unidades`);
    else row(m.kind === 'herraje' ? 'Herrajes' : 'Tornillería y consumibles', m.name, need, m.unit, m.price / (m.pres || 1), '', m.code ? `Código ${m.code}` : ''); });
  const mt = matById('c_tor'), me = matById('c_elec'), md = matById('c_disco'), ml = matById('c_lija');
  if (mt && C.screws) { const need = C.screws * n; row('Tornillería y consumibles', mt.name, Math.ceil(need / (mt.pres || 100)), 'caja', mt.price, `${fmt(need)} tornillos`); }
  if (me && C.joints) { const need = C.joints * st.lbPerJoint * n; row('Tornillería y consumibles', me.name, Math.ceil(need), 'lb', me.price, `${fmt(need, 2)} lb para ${fmt(C.joints * n)} uniones`); }
  if (md && C.steelCuts) { const need = C.steelCuts * n / (st.cutsPerDisc || 25); row('Tornillería y consumibles', md.name, Math.ceil(need), 'unidad', md.price, `${fmt(C.steelCuts * n)} cortes`); }
  // pintura y acabado
  C.lines.filter(l => l.group === 'Acabado').forEach(l => {
    const m = l.label === 'Lijas' ? ml : S.materials.find(x => x.name === l.label); const need = l.qty * n;
    if (m && m.unit === 'galón') row('Pintura y acabado', m.name, Math.ceil(need), 'galón', m.price, `${fmt(need, 2)} galones${l.note ? ' · ' + l.note : ''}`);
    else if (l.unit === 'm²') row('Pintura y acabado', `${l.label} (contratar servicio)`, Math.round(need * 100) / 100, 'm²', l.up, '', l.note || '');
    else row('Pintura y acabado', l.label, Math.ceil(need), l.unit, l.up, '');
  });
  const other = [['Soldadura (energía y gas)', C.lines.filter(l => /Soldadura \(energía/.test(l.label)).reduce((s, l) => s + l.total, 0) * n], ['Mano de obra', C.groups['Mano de obra'] * n], ['Transporte e instalación', C.groups['Transporte'] * n], ['Gastos indirectos', C.groups['Gastos indirectos'] * n]].filter(o => o[1] > 0);
  const total = R.reduce((s, r) => s + r.total, 0);
  return { n, rows: R, total, other, cost: C.cost * n, sale: C.sale * n, P };

const HIST = { stack: [], redo: [], last: null, timer: null, delAt: 0, max: 50 };
function histSnap() {

}
function histReset() { clearTimeout(HIST.timer); HIST.timer = null; HIST.stack = []; HIST.redo = []; HIST.last = histSnap(); updateUndoUI(); }
function histSchedule() { if (clientP) return; clearTimeout(HIST.timer); HIST.timer = setTimeout(histCommit, 600); }
function histCommit() {

  const s = histSnap(); if (s === HIST.last) return;
  HIST.stack.push(HIST.last); if (HIST.stack.length > HIST.max) HIST.stack.shift();

}

  S.projects = d.projects.map(p => Object.assign(p, { updated: p.updated || now })); S.materials = d.materials; S.quotes = d.quotes; S.settings = d.settings; S.currentId = d.currentId;

function redoAction() {

  t.style.pointerEvents = 'auto'; t.classList.add('show'); clearTimeout(t._h);
